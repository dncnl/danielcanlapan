<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>dncnl.dev — Daniel Martin Canlapan</title>
<link rel="stylesheet" href="styles.css">
<style>html{scroll-behavior:smooth}body{min-height:100vh}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="nav.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="intro.jsx"></script>
<script type="text/babel" src="work.jsx"></script>
<script type="text/babel" src="skills.jsx"></script>
<script type="text/babel" src="about.jsx"></script>
<script type="text/babel" src="contact.jsx"></script>
<script type="text/babel" src="footer.jsx"></script>
<script type="text/babel">
const SECTIONS = ['top', 'work', 'skills', 'about', 'contact'];

function Site() {
  const [theme, setTheme] = React.useState(() => localStorage.getItem('dncnl-theme') || 'dark');
  const [active, setActive] = React.useState('top');
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('dncnl-theme', theme);
  }, [theme]);
  React.useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY + 120;
      let current = 'top';
      for (const id of SECTIONS) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) current = id;
      }
      setActive(current);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const onNav = (id) => {
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: id === 'top' ? 0 : el.offsetTop - 76, behavior: 'smooth' });
  };
  return (
    <React.Fragment>
      <Nav theme={theme} setTheme={setTheme} active={active} onNav={onNav} />
      <Hero onNav={onNav} />
      <Intro />
      <Work />
      <Skills />
      <About />
      <Contact />
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script>
</body></html>
